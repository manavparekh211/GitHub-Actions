name: 08 - Caching
on: 
    workflow_dispatch:
        inputs:
            use-cache:
                description: "Whether to execute cache step"
                type: boolean
                default: true
jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
                working-directory: ./caching
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                node-version: '24.x'
            - name: Install dependencies
              run: npm ci
            - name: Testing
              run: npm run test
            - name: Building
              run: npm run build
            - name: Deploying to nonprod
              run: echo "Deploying to nonprod"