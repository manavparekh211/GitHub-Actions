name: 08 - Caching
on: 
    workflow_dispatch:
        inputs:
            use-cache:
                description: "Whether to execute cache step"
                type: boolean
                default: true
            node-version:
                description: Node Version
                type: choice
                options:
                    - 24.x
                    - 26.x
                default: 24.x
jobs:
    install-deps:
        runs-on: ubuntu-latest    
        defaults:
            run:
                working-directory: ./caching/react-app
        outputs:
            deps-cache-key: ${{ steps.cache-key.outputs.CACHE-KEY }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                node-version: '${{ inputs.node-version }}'
            - name: Calculate Cache Key
              id: cache-key
              run: |
                echo "CACHE-KEY=deps-node-modules-${{ hashFiles('caching/react-app/package-lock.json') }}" >> $GITHUB_OUTPUT
            - name: Download cached dependencies
              id: cache
              if: ${{ inputs.use-cache }}
              uses: actions/cache@v6
              with:
                path: caching/react-app/node_modules
                key: ${{ steps.cache-key.outputs.CACHE-KEY }}
            - name: Install dependencies
              if: steps.cache.outputs.cache-hit != 'true'
              run: npm ci
    lint-test:
        runs-on: ubuntu-latest
        needs: install-deps
        defaults:
            run:
                working-directory: ./caching/react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                node-version: '${{ inputs.node-version }}'
            - name: Download cached dependencies
              id: cache
              if: ${{ inputs.use-cache }}
              uses: actions/cache@v6
              with:
                path: caching/react-app/node_modules
                key: ${{ needs.install-deps.outputs.deps-cache-key }}
            - name: Testing
              run: npm run test
            - name: Linting
              run: echo "Linting Tests begin"
    build:
        runs-on: ubuntu-latest
        needs: install-deps
        defaults:
            run:
                working-directory: ./caching/react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                node-version: '${{ inputs.node-version }}'
            - name: Download cached dependencies
              id: cache
              if: ${{ inputs.use-cache }}
              uses: actions/cache@v6
              with:
                path: caching/react-app/node_modules
                key: ${{ needs.install-deps.outputs.deps-cache-key }}
            - name: Building
              run: npm run build
            - name: Deploying to nonprod
              run: echo "Deploying to nonprod"