name: 09 - Artifacts
on: workflow_dispatch
env:
    build-artifact-key: app-${{ github.sha }}
    test-coverage-key: test-coverage-${{ github.sha }}
jobs:
    test-build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./caching/react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                node-version: '24.x'
            - name: Download cached dependencies
              id: cache
              uses: actions/cache@v6
              with:
                path: caching/react-app/node_modules
                key: deps-node-modules-${{ hashFiles('caching/react-app/package-lock.json') }}
            - name: Install dependencies
              if: steps.cache.outputs.cache-hit != 'true'
              run: npm ci
            - name: Unit Tests
              run: npm run test -- --coverage
            - name: Build code
              run: npm run build
            - name: Upload test results
              uses: actions/upload-artifact@v7
              with:
                name: ${{ env.test-coverage-key }}
                path: caching/react-app/coverage
            - name: Upload build files
              uses: actions/upload-artifact@v7
              with:
                name: app
                path: caching/react-app/build
    deploy:
        runs-on: ubuntu-latest
        needs: test-build
        steps:
            - name: Download build files
              uses: actions/download-artifact@v8
              with:
                name: app
                path: build
            - name: Show folder structure
              run: ls -R