name: 04 - Using Actions
on: push
jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: using-actions/react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Setup Node 24.x
              uses: actions/setup-node@v7
              with:
                node-version: 24
            - name: Install dependencies
              run: npm ci
            - name: Run Unit Tests
              run: npm run test